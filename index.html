<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./public/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./public/css/index.css" />
    <title>LionsGeek Challenge</title>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <h1>Your Result</h1>
        <div class="circle">
          <p class="score">76</p>
          <p>of 100</p>
        </div>
        <h2>Great</h2>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div class="right">
        <h2>Summary</h2>
        <div class="container-right">
          <div class="value">
            <div class="left-value">
              <img src="./public/images/red.svg" alt="" />
              <p>Reaction</p>
            </div>
            <div class="right-value">
              <p><span>80 </span>/ 100</p>
            </div>
          </div>
          <div class="value color-2">
            <div class="left-value">
              <img src="./public/images/orange.svg" alt="" />
              <p>Memory</p>
            </div>
            <div class="right-value">
              <p><span>92 </span>/ 100</p>
            </div>
          </div>
          <div class="value color-3">
            <div class="left-value">
              <img src="./public/images/green.svg" alt="" />
              <p>Verbal</p>
            </div>
            <div class="right-value">
              <p><span>61 </span>/ 100</p>
            </div>
          </div>
          <div class="value color-4">
            <div class="left-value">
              <img src="./public/images/blue.svg" alt="" />
              <p>Visual</p>
            </div>
            <div class="right-value">
              <p><span>72 </span>/ 100</p>
            </div>
          </div>
        </div>
        <div class="button">
          <button>Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
